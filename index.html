<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelime Arenası</title><style>*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#fff;font:16px system-ui}main{max-width:480px;margin:auto;min-height:100dvh;padding:16px;display:flex;flex-direction:column;gap:12px}header{display:flex;justify-content:space-between;color:#a6b7ce}h1{text-align:center;font-size:28px;margin:0}#time{text-align:center;font-size:64px;font-weight:900;color:#ffcf57}.track{background:#26344a;height:8px;border-radius:8px;overflow:hidden}#bar{background:#ffcf57;height:100%}section{background:#142137;border-radius:20px;padding:16px;text-align:center}#question{font-size:23px;font-weight:700}#letters{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:16px 0}#letters span{width:clamp(22px,8vw,42px);height:44px;display:grid;place-items:center;background:#263b59;border-radius:8px;font-size:23px;font-weight:bold}#message{min-height:25px;color:#ffcf57;font-weight:bold}#scores div{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #28374b}button,input{font:inherit;border:0;border-radius:9px;padding:10px}button{background:#ffcf57;color:#111827;font-weight:700;cursor:pointer}input{width:100%;background:#26344a;color:white}details{margin-top:auto}form{display:grid;gap:8px}.controls{display:flex;gap:6px;flex-wrap:wrap}small{color:#a6b7ce}body.broadcast details{display:none}#exit{display:none}body.broadcast #exit{display:block;align-self:flex-end;background:#26344a;color:white}</style><main><header><span id="status">● TEST MODU</span><span id="round">TUR 0</span></header><h1>KELİME ARENASI</h1><div id="time">30</div><div class="track"><div id="bar"></div></div><section><small id="category"></small><p id="question">Oyunu başlat!</p><div id="letters"></div><small>Cevabını TikTok yorumlarına yaz!</small><p id="message"></p></section><section><b>🏆 LİDERLİK TABLOSU</b><div id="scores">Henüz puan yok</div></section><button id="exit">Yönetim</button><details><summary>Yönetim / test</summary><form id="connect"><input id="tiktok" placeholder="TikTok kullanıcı adı" required><input id="key" type="password" placeholder="Yönetim anahtarı" required><button>TikTok'a bağlan</button></form><button id="logout" hidden>Oturumu kapat</button><p id="connectionInfo"></p><div class="controls"><button id="start">Başlat</button><button id="pause">Duraklat</button><button id="skip">Atla</button><button id="full">Tam ekran</button></div><form id="test"><input id="user" placeholder="Test kullanıcı adı" required><input id="answer" placeholder="Test cevabı" required><button>Yorum gönder (test)</button></form></details></main><script>
const questions=[['Doğa','Gökyüzünden düşen su damlaları','YAĞMUR'],['Hayvan','Uzun boyunlu Afrika hayvanı','ZÜRAFA'],['Meyve','Sarı ve ekşi bir meyve','LİMON'],['Eşya','Zamanı gösteren araç','SAAT'],['Şehir','Türkiye’nin başkenti','ANKARA'],['Hayvan','Bal yapan böcek','ARI'],['Doğa','Gece gökyüzünde parlayan gök cismi','YILDIZ'],['Meslek','Uçak kullanan kişi','PİLOT'],['Eşya','Kapıyı açmaya yarayan küçük araç','ANAHTAR'],['Meyve','Dışı yeşil, içi kırmızı yaz meyvesi','KARPUZ'],['Hayvan','Denizde yaşayan sekiz kollu canlı','AHTAPOT'],['Genel kültür','Dünyanın doğal uydusu','AY']];const $=id=>document.getElementById(id);let pool=[],q=null,round=0,t=30,state='idle',scores=new Map(),transition=0;const norm=s=>s.trim().toLocaleLowerCase('tr').normalize('NFD').replace(/\p{M}/gu,'').replace(/ı/g,'i');function render(){ $('time').textContent=String(t).padStart(2,'0');$('bar').style.width=t/30*100+'%';if(q){$('letters').replaceChildren(...Array.from(q[2],(c,i)=>{let s=document.createElement('span');s.textContent=state==='result'||i<Math.min(q[2].length-1,Math.floor((30-t)/10))?c:'?';return s}))}}function next(){clearTimeout(transition);if(!pool.length){pool=[...questions];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}q=pool.pop();round++;t=30;state='running';$('round').textContent='TUR '+round;$('category').textContent=q[0]+' • '+q[2].length+' HARF';$('question').textContent=q[1];$('message').textContent='';render()}function finish(user){if(state!=='running')return;state='result';if(user){scores.set(user,(scores.get(user)||0)+10);$('scores').replaceChildren(...[...scores].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([u,p],i)=>{let d=document.createElement('div');d.textContent=(i+1)+'. '+u;let b=document.createElement('b');b.textContent=p+' P';d.append(b);return d}));} $('message').textContent=user?'🏆 '+user+' +10 puan':'Süre doldu! '+q[2];render();transition=setTimeout(next,3000)}function acceptComment(user,answer){if(state==='running'&&norm(answer)===norm(q[2]))finish(user)}setInterval(()=>{if(state==='running'){t--;if(t<=0)finish();render()}},1000);$('start').onclick=()=>{if(state==='idle')next();else if(state==='paused'){state='running';$('message').textContent=''}};$('pause').onclick=()=>{if(state==='running'||state==='result'){clearTimeout(transition);state='paused';if(t<=0)t=30;$('message').textContent='Duraklatıldı'}};$('skip').onclick=next;$('test').onsubmit=e=>{e.preventDefault();acceptComment($('user').value,$('answer').value);$('answer').value=''};
const events=new EventSource('/events');events.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='chat')acceptComment('@'+d.user,d.answer);if(d.type==='status')$('status').textContent=({'connected':'● TIKTOK BAĞLI','connecting':'● BAĞLANIYOR','error':'● BAĞLANTI HATASI','disconnected':'● BAĞLI DEĞİL'})[d.status]||d.status};events.onerror=()=>{$('status').textContent='● SUNUCU BAĞLANTISI YOK'};
async function refreshSession(){try{const d=await (await fetch('/session')).json();$('key').hidden=d.authenticated;$('key').required=!d.authenticated;$('logout').hidden=!d.authenticated;if(d.authenticated)$('key').value=''}catch{}}refreshSession();$('logout').onclick=async()=>{await fetch('/logout',{method:'POST'});await refreshSession()};$('connect').onsubmit=async e=>{e.preventDefault();try{if(!$('key').hidden){const login=await fetch('/login',{method:'POST',headers:{'x-admin-key':$('key').value}});if(!login.ok){$('connectionInfo').textContent='Yönetim anahtarı yanlış';return}await refreshSession()}const r=await fetch('/connect',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('key').value},body:JSON.stringify({username:$('tiktok').value})});let d=await r.json().catch(()=>({}));$('connectionInfo').textContent=r.ok?'Bağlandı':d.error||'Bağlantı başarısız: '+r.status}catch{$('connectionInfo').textContent='Sunucuya erişilemedi'}};
$('full').onclick=async()=>{document.querySelector('details').open=false;document.body.classList.add('broadcast');try{await document.documentElement.requestFullscreen()}catch{}};$('exit').onclick=async()=>{document.body.classList.remove('broadcast');if(document.fullscreenElement)await document.exitFullscreen()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('broadcast')});
</script></html>
