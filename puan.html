<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelime Arenası | Puanım</title><style>body{background:#101c30;color:#fff;font:16px system-ui;max-width:420px;margin:60px auto;padding:24px}h1{color:#ffd166}input,button{box-sizing:border-box;width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;font:inherit}button{background:#41e5cf;font-weight:bold}pre{white-space:pre-wrap;font:inherit;line-height:2;background:#20314b;padding:20px;border-radius:12px}</style><h1>KELİME ARENASI</h1><h2>Puanım ve sıralamam</h2><form><input required maxlength="25" placeholder="TikTok kullanıcı adın"><button>Puanımı göster</button></form><pre aria-live="polite">Kullanıcı adını gir.</pre><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('pre'),b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/score?user='+encodeURIComponent(document.querySelector('input').value));if(!r.ok)throw Error();const d=await r.json();out.textContent='@'+d.user+'\nBugünkü puan: '+d.daily+'\nBugünkü sıra: '+(d.dailyRank||'—')+'\nToplam puan: '+d.total+'\nGenel sıra: '+(d.totalRank||'—')}catch{out.textContent='Sorgulanamadı. Kullanıcı adını kontrol et.'}finally{setTimeout(()=>b.disabled=false,1000)}};</script></html>
